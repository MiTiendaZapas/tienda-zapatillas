<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Exclusivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mi Tienda Zapas</h1>
        <button class="carrito-btn" onclick="abrirCarrito()">
            🛒 <span class="badge" id="contador-carrito">0</span>
        </button>
    </header>

    <div class="buscador-container">
        <input type="text" id="buscador" placeholder="🔍 Buscar modelo..." onkeyup="filtrarCatalogo()">
    </div>

    <div class="container">
        <div class="grid-productos" id="grid-productos"></div>
    </div>

    <div class="modal-overlay" id="modal-carrito">
        <div class="modal-carrito">
            <div class="header-modal">
                <h2>Tu Pedido</h2>
                <button class="close-btn" onclick="cerrarCarrito()">✖</button>
            </div>
            
            <ul class="lista-carrito" id="lista-carrito"></ul>
            
            <!-- ACÁ SE INYECTAN LOS BOTONES DE COMPRA AUTOMÁTICAMENTE -->
            <div id="footer-opciones" class="footer-modal"></div>
        </div>
    </div>

    <!-- Forzamos la lectura del catálogo -->
    <script>
        document.write('<script src="catalogo.js?v=' + Math.random() + '"><\/script>');
    </script>
    
    <!-- ACÁ ESTÁ EL CAMBIO ANTI-CACHÉ PARA EL MOTOR DE LA TIENDA -->
    <script src="tienda.js?v=1"></script>
</body>
</html>
