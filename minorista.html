<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Minorista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mi Tienda Zapas - Minorista</h1>
        <button class="carrito-btn" onclick="abrirCarrito()">
            🛒 <span class="badge" id="contador-carrito">0</span>
        </button>
    </header>

    <div class="buscador-container">
        <input type="text" id="buscador" placeholder="🔍 Buscar modelo..." onkeyup="filtrarCatalogo()">
    </div>

    <div class="container">
        <div class="grid-productos" id="grid-productos"></div>
    </div>

    <div class="modal-overlay" id="modal-carrito">
        <div class="modal-carrito">
            <div class="header-modal">
                <h2>Tu Pedido Minorista</h2>
                <button class="close-btn" onclick="cerrarCarrito()">✖</button>
            </div>
            
            <ul class="lista-carrito" id="lista-carrito"></ul>
            
            <div id="footer-opciones" class="footer-modal"></div>
        </div>
    </div>

    <!-- 1. Indumentaria fija con su stock exacto integrada directamente aquí -->
    <script>
        const stock_indumentaria = [
          { modelo: 'Remera adidas blanca', talles: [{"talle": "S", "stock": 1}, {"talle": "M", "stock": 0}, {"talle": "L", "stock": 1}, {"talle": "XL", "stock": 0}, {"talle": "XXL", "stock": 0}], foto: 'Fotos/Remera adidas blanca.jpeg' },
          { modelo: 'Remera adidas negra', talles: [{"talle": "S", "stock": 0}, {"talle": "M", "stock": 0}, {"talle": "L", "stock": 0}, {"talle": "XL", "stock": 0}, {"talle": "XXL", "stock": 0}], foto: 'Fotos/Remera adidas negra.jpeg' },
          { modelo: 'baggy NK BORDADO gris', talles: [{"talle": "S", "stock": 1}, {"talle": "M", "stock": 0}, {"talle": "L", "stock": 0}, {"talle": "XL", "stock": 0}, {"talle": "XXL", "stock": 1}], foto: 'Fotos/baggy NK BORDADO gris.jpeg' },
          { modelo: 'baggy NK BORDADO negro', talles: [{"talle": "S", "stock": 1}, {"talle": "M", "stock": 1}, {"talle": "L", "stock": 0}, {"talle": "XL", "stock": 1}, {"talle": "XXL", "stock": 1}], foto: 'Fotos/baggy NK BORDADO negro.jpeg' }
        ];
    </script>
    
    <!-- 2. Cargamos el catálogo de zapatillas del bot con anti-caché -->
    <script>
        document.write('<script src="catalogo.js?v=' + Math.random() + '"><\/script>');
    </script>

    <!-- 3. Unimos ambas listas bajo la variable que lee minorista.js -->
    <script>
        const stock_actualizado = [...stock_indumentaria, ...(typeof stock_zapatillas !== 'undefined' ? stock_zapatillas : [])];
    </script>

    <script src="minorista.js"></script>
</body>
</html>
