<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Minorista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mi Tienda Zapas - Minorista</h1>
        <button class="carrito-btn" onclick="abrirCarrito()">
            🛒 <span class="badge" id="contador-carrito">0</span>
        </button>
    </header>

    <div class="buscador-container">
        <input type="text" id="buscador" placeholder="🔍 Buscar modelo..." onkeyup="filtrarCatalogo()">
    </div>

    <div class="container">
        <div class="grid-productos" id="grid-productos"></div>
    </div>

    <div class="modal-overlay" id="modal-carrito">
        <div class="modal-carrito">
            <div class="header-modal">
                <h2>Tu Pedido Minorista</h2>
                <button class="close-btn" onclick="cerrarCarrito()">✖</button>
            </div>
            
            <ul class="lista-carrito" id="lista-carrito"></ul>
            
            <div id="footer-opciones" class="footer-modal"></div>
        </div>
    </div>

    <!-- 1. Indumentaria: stock cargado a mano en indumentaria.js (anti-caché) -->
    <script>
        document.write('<script src="indumentaria.js?v=' + Math.random() + '"><\/script>');
    </script>

    <!-- 2. Zapatillas cargadas a mano (no vienen de la tienda online). Editar zapatillas_manual.js (anti-caché) -->
    <script>
        document.write('<script src="zapatillas_manual.js?v=' + Math.random() + '"><\/script>');
    </script>

    <!-- 3. Cargamos el catálogo de zapatillas del bot con anti-caché -->
    <script>
        document.write('<script src="catalogo.js?v=' + Math.random() + '"><\/script>');
    </script>

    <!-- 4. Unimos: indumentaria, zapatillas manuales, zapatillas del bot -->
    <script>
        const stock_actualizado = [
            ...stock_indumentaria,
            ...(typeof stock_zapatillas_manual !== 'undefined' ? stock_zapatillas_manual : []),
            ...(typeof stock_zapatillas !== 'undefined' ? stock_zapatillas : [])
        ];
    </script>

    <script src="minorista.js"></script>
</body>
</html>
